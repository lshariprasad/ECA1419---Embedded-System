<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="58" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#102a43">Experiment 3 — Health Monitoring Node</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="55" y="165" width="245" height="130" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <text x="177" y="213" font-size="24" font-weight="700" fill="#0c4a6e">LM75AD</text>
    <text x="177" y="250" font-size="18" fill="#0c4a6e">Temperature sensor</text>
    <text x="177" y="276" font-size="16" fill="#0c4a6e">I²C: SDA / SCL</text>

    <rect x="55" y="365" width="245" height="130" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>
