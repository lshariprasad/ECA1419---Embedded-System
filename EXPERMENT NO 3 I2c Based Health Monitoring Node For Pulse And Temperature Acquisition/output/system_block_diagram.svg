  <g stroke="#334155" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 230 H455"/><path d="M300 430 H370 V390 H455"/>
    <path d="M740 300 H820 V230 H895"/><path d="M740 385 H820 V430 H895"/>
