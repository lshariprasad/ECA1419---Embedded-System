  <g fill="#334155"><path d="M444 220 L455 230 L444 240 Z"/><path d="M444 380 L455 390 L444 400 Z"/><path d="M884 220 L895 230 L884 240 Z"/><path d="M884 420 L895 430 L884 440 Z"/></g>
  <text x="600" y="555" font-family="Arial" font-size="17" text-anchor="middle" fill="#475569">Note: The temperature sensor uses I²C. The LM016L display shown here is parallel, not I²C.</text>
