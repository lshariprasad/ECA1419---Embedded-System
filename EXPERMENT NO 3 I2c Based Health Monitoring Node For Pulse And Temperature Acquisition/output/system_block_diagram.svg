    <text x="177" y="450" font-size="18" fill="#831843">Simulated pulse output</text>
    <text x="177" y="476" font-size="16" fill="#831843">Digital signal → D2</text>

    <rect x="455" y="245" width="285" height="190" rx="22" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="597" y="305" font-size="27" font-weight="700" fill="#14532d">Arduino UNO</text>
    <text x="597" y="347" font-size="19" fill="#14532d">I²C acquisition</text>
    <text x="597" y="379" font-size="19" fill="#14532d">Pulse edge timing</text>
    <text x="597" y="411" font-size="19" fill="#14532d">BPM calculation</text>

