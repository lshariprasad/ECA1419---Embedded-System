    <text x="1017" y="276" font-size="16" fill="#78350f">4-bit parallel mode</text>

    <rect x="895" y="365" width="245" height="130" rx="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="1017" y="413" font-size="24" font-weight="700" fill="#4c1d95">Serial Monitor</text>
